<div class="search-container">
    <form action="" method="GET" class="advanced-search-form" id="searchForm">
        <div class="main-search-row">
            <div class="search-inputs">
                <input type="text" 
                       name="q" 
                       id="mainSearch" 
                       placeholder="Search name, or use syntax (e.g. set:uma loc:binder qty>3)..." 
                       value="{{ request.args.get('q', '') }}"
                       autocomplete="off">
                <button type="submit" class="btn-primary">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            
            <button type="button" class="btn-secondary" id="toggleFilters">
                <i class="fas fa-sliders-h"></i> Filters
            </button>

            {% if request.args %}
                <a href="{{ request.path }}" class="btn-clear" title="Clear All">
                    <i class="fas fa-times"></i>
                </a>
            {% endif %}
        </div>

        <div class="advanced-filters {% if not (request.args.get('name') or request.args.get('set') or request.args.get('location')) %}hidden{% endif %}" id="filterDrawer">
            <div class="filter-grid">
                <div class="filter-group">
                    <label>Card Name</label>
                    <input type="text" name="name" placeholder="Specific name..." value="{{ request.args.get('name', '') }}">
                </div>

                <div class="filter-group">
                    <label>Set Code</label>
                    <input type="text" name="set" placeholder="e.g. MH3" value="{{ request.args.get('set', '') }}">
                </div>

                <div class="filter-group">
                    <label>Location</label>
                    <select name="location">
                        <option value="">All Locations</option>
                        {% for loc in locations %}
                            <option value="{{ loc.id }}" {% if request.args.get('location')|string == loc.id|string %}selected{% endif %}>
                                {{ loc.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="filter-group">
                    <label>Quantity</label>
                    <input type="text" name="qty" placeholder="e.g. >3 or 1" value="{{ request.args.get('qty', '') }}">
                </div>

                <div class="filter-group">
                    <label>Type / Text</label>
                    <input type="text" name="type" placeholder="Creature, Instant..." value="{{ request.args.get('type', '') }}">
                </div>

                <div class="filter-group">
                    <label>Color Identity</label>
                    <input type="text" name="color" placeholder="WUBRG or id:WUB" value="{{ request.args.get('color', '') }}">
                </div>
            </div>
        </div>
    </form>
</div>
