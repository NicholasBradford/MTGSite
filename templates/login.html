{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Admin Access</h2>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="auth-flash">
                    {% for message in messages %}
                        {{ message }}
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('authentication.login') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="auth-form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="auth-form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="auth-form-group auth-remember-group">
                <label>
                    <input type="checkbox" name="remember"> Stay logged in
                </label>
            </div>
            <button type="submit" class="auth-button">Sign In</button>
            <input type="hidden" name="next" value="{{ next or request.args.get('next', '') }}">
        </form>


        <div class="auth-footer">
            Don't have an account? <a href="/register">Create Account</a>
        </div>
    </div>
</div>
{% endblock %}
