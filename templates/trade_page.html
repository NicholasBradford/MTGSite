{% extends "base.html" %}
{% block title %}Trade Request{% endblock %}

{% block content %}
<div class="trade-dashboard trade-page">
    
    <div class="search-container">
        <input type="text" id="outgoing-search" class="trade-search-input" placeholder="Search the Trade Binder... (e.g., Boros)" autocomplete="off">
        <div id="search-dropdown" class="is-hidden"></div>
    </div>

    <div class="trade-columns">
        <div class="column" id="outgoing-column">
            <h2>Requested</h2>
            <div class="card-grid" id="outgoing-grid">
                </div>
        </div>

        <div class="column" id="incoming-column">
            <h2>Offer</h2>
            
            <div class="incoming-form">
                <input type="text" id="inc-set" class="trade-input" placeholder="Set (e.g. sos)" size="8">
                <input type="text" id="inc-cn" class="trade-input" placeholder="CN" size="5">
                <select id="inc-finish" class="trade-select">
                    <option value="nonfoil">Non-Foil</option>
                    <option value="foil">Foil</option>
                </select>
                <button type="button" class="site-button site-button--accent trade-action-button" onclick="addIncomingCard(event)">Add</button>
            </div>

            <div class="card-grid" id="incoming-grid">
                </div>
        </div>
    </div>
</div>
<div class="trade-submit-section">
    {% if current_user.is_authenticated %}
        <button id="submit-trade-btn" class="site-button site-button--accent trade-submit-button" onclick="submitTradeRequest()">
            Submit Trade Proposal
        </button>
    {% else %}
        <div class="trade-auth-prompt">
            <p class="trade-auth-copy">Ready to finalize this trade?</p>
            <a href="{{ url_for('authentication.login') }}" class="site-button site-button--accent trade-login-button">
                Log In to Submit Trade
            </a>
        </div>
    {% endif %}
</div>

<script>
    let rawPath = "{{ config['IMAGE_PATH'] or '/static/images/' }}";
    const IMAGE_BASE_PATH = rawPath.replace(/\/$/, '') + '/';
    let searchTimeout = null;
    const searchInput = document.getElementById('outgoing-search');
    const dropdown = document.getElementById('search-dropdown');
    
    // Live Search Event
    searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        const query = this.value.trim();
        
        if (query.length < 2) {
            dropdown.classList.add('is-hidden');
            return;
        }

        searchTimeout = setTimeout(() => {
            fetch(`/api/trade_search?q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => {
                    dropdown.innerHTML = '';
                    if (data.length > 0) {
                        data.forEach(card => {
                            const item = document.createElement('div');
                            item.className = 'trade-dropdown-item';
                            // Build the dropdown row visually
                            item.innerHTML = `
                                    <img src="${IMAGE_BASE_PATH}${card.image_url}" alt="${card.name}" loading="lazy">                                
                                <div class="trade-dropdown-item__details">
                                    <span class="trade-dropdown-item__name">${card.name}</span>
                                    <span class="trade-dropdown-item__meta">${card.set_code.toUpperCase()} #${card.collector_number} - ${card.finish}</span>
                                    <span class="trade-dropdown-item__available">(Available: ${card.qty})</span>
                                </div>
                            `;
                            // When clicked, add to outgoing grid
                            item.onclick = () => {
                                const selector = `#outgoing-grid .trade-card[data-id="${card.scryfall_id}"][data-finish="${card.finish}"]`;
                                const currentInTrade = document.querySelectorAll(selector).length;
                                if (currentInTrade >= card.qty) {
                                    alert(`Limit Reached: There are only ${card.qty} tradeable copies of ${card.name} (${card.finish}).`);
                                    return; // Stop the function here
                                }
                                console.log("Card object from search:", card);
                                addCardToGrid('outgoing-grid', card);
                                searchInput.value = '';
                                dropdown.classList.add('is-hidden');
                            };
                            dropdown.appendChild(item);
                        });
                        dropdown.classList.remove('is-hidden');
                    } else {
                        dropdown.classList.add('is-hidden');
                    }
                });
        }, 300); // 300ms delay to prevent spamming the DB
    });

    // Hide dropdown if clicked outside
    document.addEventListener('click', function(e) {
        if (e.target !== searchInput && e.target !== dropdown) {
            dropdown.classList.add('is-hidden');
        }
    });

    // Handle incoming card lookup
    function addIncomingCard() {
        const setCode = document.getElementById('inc-set').value;
        const cn = document.getElementById('inc-cn').value;
        const finish = document.getElementById('inc-finish').value;

        if (!setCode || !cn) {
            alert("Please provide both Set Code and Collector Number.");
            return;
        }

        fetch('/api/fetch_incoming', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken() },
            body: JSON.stringify({ set_code: setCode, cn: cn, finish: finish })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                addCardToGrid('incoming-grid', data);
                // Clear inputs
                document.getElementById('inc-set').value = '';
                document.getElementById('inc-cn').value = '';
            } else {
                alert(data.error || "Failed to find card.");
            }
        });
    }

    // Generic function to append card UI to either grid
    function addCardToGrid(gridId, card) {
        const grid = document.getElementById(gridId);

        const existingCard = grid.querySelector(`.trade-card[data-id="${card.scryfall_id}"][data-finish="${card.finish}"]`);
        
        if (existingCard) {
            let currentQty = parseInt(existingCard.getAttribute('data-qty'));

            // 2. Inventory Check (Only for Outgoing/Yours)
            if (gridId === 'outgoing-grid' && currentQty >= card.qty) {
                alert(`Limit Reached: You only have ${card.qty} tradeable copies of ${card.name}.`);
                return;
            }

            // 3. Update existing stack
            let newQty = currentQty + 1;
            existingCard.setAttribute('data-qty', newQty);
            existingCard.querySelector('.qty-badge').innerText = `x${newQty}`;
            existingCard.querySelector('.qty-badge').classList.remove('is-hidden');
            return; // Exit function so we don't create a duplicate element
        }

        const cardDiv = document.createElement('div');
        cardDiv.className = 'trade-card';
        cardDiv.setAttribute('data-id', card.scryfall_id);
        cardDiv.setAttribute('data-finish', card.finish);
        cardDiv.setAttribute('data-qty', "1");
        cardDiv.setAttribute('data-set', card.set_code);
        cardDiv.setAttribute('data-cn', card.cn || card.collector_number);
        
        // Remove button logic
        const btn = document.createElement('button');
        btn.className = 'remove-btn';
        btn.innerText = 'X';
        btn.onclick = () => {
            cardDiv.remove();
            cardDiv.setAttribute('data-qty', "0");
        }

        // Image
        const img = document.createElement('img');
        img.src = (card.image_url && card.image_url.startsWith('http')) 
              ? card.image_url 
              : `${IMAGE_BASE_PATH}${card.image_url}`;
        img.alt = card.name;

        const badge = document.createElement('span');
        badge.className = 'qty-badge';
        badge.innerText = 'x1';
        badge.classList.add('is-hidden');

        
        
        if (card.finish === 'foil') {
            const wrapper = document.createElement('div');
            wrapper.className = 'trade-foil-frame';
            wrapper.appendChild(img); 
            cardDiv.appendChild(wrapper);
        } else {
            cardDiv.appendChild(img); 
        }

        cardDiv.appendChild(btn);
        cardDiv.appendChild(badge);
        
        const label = document.createElement('span');
        label.className = 'card-name-label';
        label.innerText = card.name;
        cardDiv.appendChild(label);
        
        grid.appendChild(cardDiv);
    }

    function submitTradeRequest() {
        // 1. Grab all card elements from both grids
        const outboundNodes = document.querySelectorAll('#outgoing-grid .trade-card');
        const inboundNodes = document.querySelectorAll('#incoming-grid .trade-card');

        // 2. Validate that at least one grid has items
        if (outboundNodes.length === 0 && inboundNodes.length === 0) {
            alert("Select at least one card to trade.");
            return;
        }

        if (!confirm("Are you sure you want to submit this trade request?")) return;

        // 3. Helper function to extract the data attributes into an array of objects
        function extractTradeData(nodes) {
            const items = [];
            nodes.forEach(card => {
                items.push({
                    scryfall_id: card.getAttribute('data-id'),
                    finish: card.getAttribute('data-finish'),
                    qty: parseInt(card.getAttribute('data-qty')),
                    set_code: card.getAttribute('data-set'),
                    cn: card.getAttribute('data-cn')
                });
            });
            return items;
        }

        // 4. Build the correct payload to match your Flask backend
        const outboundData = extractTradeData(outboundNodes);
        const inboundData = extractTradeData(inboundNodes);

        fetch('/api/submit_trade', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken() },
            body: JSON.stringify({ 
                outbound: outboundData,
                inbound: inboundData
            }) 
        })
        .then(res => {
            if (res.status === 401) throw new Error("Please log in to continue.");
            return res.json();
        })
        .then(data => {
            if (data.success) {
                alert("Success! The binder owner has been notified.");
                // Removed local storage wipe since state is now DOM-based
                window.location.href = "/binder/trades"; // Redirect to their personal dashboard
            } else {
                alert(data.error || "Submission failed.");
            }
        })
        .catch(err => alert(err.message));
    }
</script>
{% endblock %}
